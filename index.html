
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Isibonelo Property Services | Real Estate Development & Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                600: '#E4572E',
                700: '#C94825',
              },
              ink: {
                700: '#374151',
                900: '#111111',
              },
              surface: {
                0: '#FFFFFF',
                50: '#F5F0EB',
              },
              border: {
                200: '#E5E7EB',
              },
              success: {
                600: '#16A34A',
              },
              warning: {
                600: '#D97706',
              },
              focus: {
                500: '#2563EB',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              heading: ['Poppins', 'sans-serif'],
              mono: ['"Courier New"', 'monospace'],
            },
            borderRadius: {
              'card': '16px',
              'pill': '999px',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(8px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              slideDown: {
                '0%': { opacity: '0', transform: 'translateY(-8px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            },
            animation: {
              fadeIn: 'fadeIn 0.4s ease-out',
              slideDown: 'slideDown 0.2s ease-out',
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --brand-600: #E4572E;
        --brand-700: #C94825;
        --ink-900: #111111;
        --ink-700: #374151;
        --surface-0: #FFFFFF;
        --surface-50: #F5F0EB;
        --border-200: #E5E7EB;
        --success-600: #16A34A;
        --warning-600: #D97706;
        --focus-500: #2563EB;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--surface-50);
        color: var(--ink-700);
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Poppins', sans-serif;
        color: var(--ink-900);
      }
      .focus-ring:focus-visible {
        outline: 2px solid var(--focus-500);
        outline-offset: 2px;
      }
      /* Smooth scrolling */
      html { scroll-behavior: smooth; }
      /* Section label style */
      .label-tag {
        font-family: 'Courier New', monospace;
        font-size: 11px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: rgba(55, 65, 81, 0.5);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
